  AuthGoogleStartLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: openfinance-auth-google-start
      Handler: dist/app/lambda/auth-google-start-lambda.handler
      Role: !GetAtt BackendLambdaExecutionRole.Arn
      CodeUri:
