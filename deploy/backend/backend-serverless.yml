        Key: !Sub '${DeploymentKeyPrefix}/backend.zip'

  IdentityLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt IdentityLambda.Arn
      AuthType: NONE

  IdentityLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref IdentityLambda
      Principal: '*'
