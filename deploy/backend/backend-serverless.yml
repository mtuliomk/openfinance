  InvestmentLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref InvestmentLambda
      Principal: '*'
      FunctionUrlAuthType: NONE

  ConsentLambda:
