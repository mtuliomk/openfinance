    Properties:
      TargetFunctionArn: !GetAtt LoanLambda.Arn
      AuthType: NONE

  LoanLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref LoanLambda
      Principal: '*'
      FunctionUrlAuthType: NONE

  BillLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: openfinance-bill
      Handler: dist/app/lambda/bill-lambda.handler
      Role: !GetAtt BackendLambdaExecutionRole.Arn
