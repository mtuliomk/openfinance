AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Openfinance backend serverless application

Parameters:
  Runtime:
    Type: String
    Default: nodejs20.x
  MemorySize:
    Type: Number
    Default: 512
  Timeout:
    Type: Number
    Default: 60
  DeploymentBucket:
    Type: String
  DeploymentKeyPrefix:
    Type: String
    Default: deploy-openfinance

Globals:
  Function:
    Runtime: !Ref Runtime
    MemorySize: !Ref MemorySize
    Timeout: !Ref Timeout
    Tracing: Active
    Environment:
      Variables:
        BACKEND_AUDIENCE: '{{resolve:ssm:/openfinance/backend/BACKEND_AUDIENCE}}'
        GOOGLE_CLIENT_ID: '{{resolve:ssm:/openfinance/backend/GOOGLE_CLIENT_ID}}'
        GOOGLE_CLIENT_SECRET: '{{resolve:ssm:/openfinance/backend/GOOGLE_CLIENT_SECRET}}'
        GOOGLE_REDIRECT_URI: '{{resolve:ssm:/openfinance/backend/GOOGLE_REDIRECT_URI}}'
        FRONTEND_CALLBACK_URL: '{{resolve:ssm:/openfinance/backend/FRONTEND_CALLBACK_URL}}'
        PLUGGY_CLIENT_ID: '{{resolve:ssm:/openfinance/backend/PLUGGY_CLIENT_ID}}'
        PLUGGY_CLIENT_SECRET: '{{resolve:ssm:/openfinance/backend/PLUGGY_CLIENT_SECRET}}'
        PORT: '{{resolve:ssm:/openfinance/backend/PORT}}'
        PROXY_SIGNING_SECRET: '{{resolve:ssm:/openfinance/backend/PROXY_SIGNING_SECRET}}'
        TURSO_AUTH_TOKEN: '{{resolve:ssm:/openfinance/backend/TURSO_AUTH_TOKEN}}'
        TURSO_DATABASE_URL: '{{resolve:ssm:/openfinance/backend/TURSO_DATABASE_URL}}'

Resources:
  BackendLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadBackendParameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                Resource: arn:aws:ssm:*:*:parameter/openfinance/backend/*

  AccountLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: openfinance-account
      Handler: dist/app/lambda/account-lambda.handler
      Role: !GetAtt BackendLambdaExecutionRole.Arn
      CodeUri:
        Bucket: !Ref DeploymentBucket
        Key: !Sub '${DeploymentKeyPrefix}/backend.zip'

  AccountLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AccountLambda.Arn
      AuthType: NONE

  AccountLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref AccountLambda
      Principal: '*'
      FunctionUrlAuthType: NONE

  HealthLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: openfinance-health
      Handler: dist/app/lambda/health-lambda.handler
      Role: !GetAtt BackendLambdaExecutionRole.Arn
      CodeUri:
        Bucket: !Ref DeploymentBucket
        Key: !Sub '${DeploymentKeyPrefix}/backend.zip'

  HealthLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt HealthLambda.Arn
      AuthType: NONE

  HealthLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref HealthLambda
      Principal: '*'
      FunctionUrlAuthType: NONE

  ItemsLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: openfinance-items
      Handler: dist/app/lambda/items-lambda.handler
      Role: !GetAtt BackendLambdaExecutionRole.Arn
      CodeUri:
        Bucket: !Ref DeploymentBucket
        Key: !Sub '${DeploymentKeyPrefix}/backend.zip'

  ItemsLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ItemsLambda.Arn
      AuthType: NONE

  ItemsLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ItemsLambda
      Principal: '*'
      FunctionUrlAuthType: NONE

  OpenfinanceReloadLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: openfinance-openfinance-reload
      Handler: dist/app/lambda/openfinance-reload-lambda.handler
      Role: !GetAtt BackendLambdaExecutionRole.Arn
      CodeUri:
        Bucket: !Ref DeploymentBucket
        Key: !Sub '${DeploymentKeyPrefix}/backend.zip'

  OpenfinanceReloadLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt OpenfinanceReloadLambda.Arn
      AuthType: NONE

  OpenfinanceReloadLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref OpenfinanceReloadLambda
      Principal: '*'
      FunctionUrlAuthType: NONE

  TransactionLambda:
