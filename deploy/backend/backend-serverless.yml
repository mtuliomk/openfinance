        Key: !Sub '${DeploymentKeyPrefix}/backend.zip'

  ConsentLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ConsentLambda.Arn
      AuthType: NONE

  ConsentLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ConsentLambda
      Principal: '*'
      FunctionUrlAuthType: NONE

  IdentityLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: openfinance-identity
      Handler: dist/app/lambda/identity-lambda.handler
      Role: !GetAtt BackendLambdaExecutionRole.Arn
      CodeUri:
