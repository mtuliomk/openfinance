Resources:
  AccountLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: openfinance-account
      Handler: dist/app/lambda/account-lambda.handler
      CodeUri:
        Bucket: !Ref DeploymentBucket
        Key: !Sub '${DeploymentKeyPrefix}/backend.zip'
      Environment:
        Variables:
          NODE_ENV: production
          BACKEND_AUDIENCE: '{{resolve:ssm:/openfinance/backend/BACKEND_AUDIENCE}}'
          GOOGLE_CLIENT_ID: '{{resolve:ssm:/openfinance/backend/GOOGLE_CLIENT_ID}}'
          GOOGLE_CLIENT_SECRET: '{{resolve:ssm:/openfinance/backend/GOOGLE_CLIENT_SECRET}}'
          GOOGLE_REDIRECT_URI: '{{resolve:ssm:/openfinance/backend/GOOGLE_REDIRECT_URI}}'
          PLUGGY_CLIENT_ID: '{{resolve:ssm:/openfinance/backend/PLUGGY_CLIENT_ID}}'
          PLUGGY_CLIENT_SECRET: '{{resolve:ssm:/openfinance/backend/PLUGGY_CLIENT_SECRET}}'
          PORT: '{{resolve:ssm:/openfinance/backend/PORT}}'
          PROXY_SIGNING_SECRET: '{{resolve:ssm:/openfinance/backend/PROXY_SIGNING_SECRET}}'
          TURSO_AUTH_TOKEN: '{{resolve:ssm:/openfinance/backend/TURSO_AUTH_TOKEN}}'
          TURSO_DATABASE_URL: '{{resolve:ssm:/openfinance/backend/TURSO_DATABASE_URL}}'
      Role: !GetAtt BackendLambdaExecutionRole.Arn
      Tags:
        service: openfinance
        component: backend

  AccountLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt AccountLambda.Arn
      AuthType: NONE

  AccountLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref AccountLambda
      Principal: "*"
      FunctionUrlAuthType: NONE
