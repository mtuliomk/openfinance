# Nesta arquitetura, os parametros SSM nao sao gerenciados pelo template da stack backend.
# Eles devem existir previamente em /openfinance/backend/*.
#
# Exemplo de validacao por nome (sem valores):
# aws ssm get-parameters-by-path \
#   --path /openfinance/backend/ \
#   --recursive \
#   --profile mtuliomk
#
# Exemplo de referencia no template:
# BACKEND_AUDIENCE: '{{resolve:ssm:/openfinance/backend/BACKEND_AUDIENCE}}'
